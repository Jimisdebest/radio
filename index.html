<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Songs radio</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            color: #fff;
            margin: 0;
            padding: 20px;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        
        .container {
            max-width: 600px;
            width: 100%;
            background: rgba(0, 0, 0, 0.7);
            border-radius: 15px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }
        
        header {
            text-align: center;
            margin-bottom: 30px;
            border-bottom: 2px solid #4cc9f0;
            padding-bottom: 20px;
        }
        
        h1 {
            color: #4cc9f0;
            margin: 0;
            font-size: 2.2em;
        }
        
        .subtitle {
            color: #b8b8b8;
            font-size: 1em;
            margin-top: 10px;
        }
        
        .radio-status {
            background: rgba(30, 30, 46, 0.9);
            border-radius: 10px;
            padding: 25px;
            margin-bottom: 25px;
            text-align: center;
        }
        
        .status-indicator {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
            margin-bottom: 20px;
            padding: 15px;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 8px;
        }
        
        .status-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #4cc9f0;
            animation: pulse 2s infinite;
        }
        
        .status-dot.ready {
            background: #2ecc71;
            animation: none;
        }
        
        .status-dot.playing {
            background: #e74c3c;
            animation: pulse 1s infinite;
        }
        
        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.5; }
            100% { opacity: 1; }
        }
        
        .current-track {
            background: rgba(0, 0, 0, 0.3);
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 20px;
            border-left: 4px solid #4cc9f0;
        }
        
        .track-title {
            font-size: 1.4em;
            color: #fff;
            margin: 0 0 10px 0;
        }
        
        .track-time {
            color: #4cc9f0;
            font-size: 1.1em;
            margin: 0;
        }
        
        .start-button {
            background: #4cc9f0;
            border: none;
            border-radius: 8px;
            padding: 18px 40px;
            font-size: 1.2em;
            color: #1a1a2e;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: bold;
            width: 100%;
            margin-bottom: 25px;
        }
        
        .start-button:hover {
            background: #2db2d9;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(76, 201, 240, 0.3);
        }
        
        .start-button:active {
            transform: translateY(0);
        }
        
        .start-button:disabled {
            background: #666;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }
        
        .schedule {
            background: rgba(30, 30, 46, 0.9);
            border-radius: 10px;
            padding: 25px;
        }
        
        .schedule-title {
            color: #4cc9f0;
            margin-top: 0;
            margin-bottom: 20px;
            font-size: 1.3em;
        }
        
        .schedule-list {
            list-style: none;
            padding: 0;
        }
        
        .schedule-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 15px;
            margin: 8px 0;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 6px;
            transition: all 0.3s ease;
        }
        
        .schedule-item.current-playing {
            background: rgba(231, 76, 60, 0.2);
            border-left: 4px solid #e74c3c;
        }
        
        .schedule-item.next-up {
            background: rgba(76, 201, 240, 0.2);
            border-left: 4px solid #4cc9f0;
        }
        
        .schedule-item.preloading {
            background: rgba(46, 204, 113, 0.1);
            border-left: 4px solid #2ecc71;
        }
        
        .schedule-time {
            font-weight: bold;
            font-size: 1.2em;
            color: #4cc9f0;
            min-width: 60px;
        }
        
        .schedule-track {
            color: #fff;
            flex-grow: 1;
            margin-left: 20px;
        }
        
        .schedule-status {
            color: #4cc9f0;
            font-size: 0.9em;
            min-width: 100px;
            text-align: right;
        }
        
        .loading-info {
            background: rgba(46, 204, 113, 0.1);
            border: 1px solid #2ecc71;
            border-radius: 6px;
            padding: 12px 15px;
            margin-top: 15px;
            color: #2ecc71;
            text-align: center;
        }
        
        footer {
            text-align: center;
            margin-top: 25px;
            color: #888;
            font-size: 0.9em;
        }
        
        .time-display {
            font-size: 1.1em;
            color: #4cc9f0;
            margin-top: 15px;
            text-align: center;
        }
        
        .upcoming-info {
            background: rgba(76, 201, 240, 0.1);
            border: 1px solid #4cc9f0;
            border-radius: 6px;
            padding: 12px 15px;
            margin-top: 15px;
            color: #4cc9f0;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>📻 AI Songs radio</h1>
            <div class="subtitle">Luister gratis online!</div>
        </header>
        
        <div class="radio-status">
            <div class="status-indicator">
                <div class="status-dot" id="statusDot"></div>
                <span id="statusText">Klik op START om radio te beginnen</span>
            </div>
            
            <div class="current-track">
                <h3 class="track-title" id="currentTrackTitle">Radio uitgeschakeld</h3>
                <p class="track-time" id="currentTrackTime">--:--</p>
            </div>
            
            <button class="start-button" id="startButton">
                START RADIO
            </button>
            
            <div class="time-display" id="currentTimeDisplay">
                Huidige tijd: --:--
            </div>
            
            <div class="upcoming-info" id="upcomingInfo" style="display: none;">
                <!-- Wordt gevuld met eerstvolgende uitzending -->
            </div>
        </div>
        
        <div class="schedule">
            <h3 class="schedule-title">📅 Uitzendschema Vandaag</h3>
            <ul class="schedule-list" id="scheduleList">
                <!-- Schedule wordt geladen via JavaScript -->
            </ul>
            
            <div class="loading-info" id="loadingInfo" style="display: none;">
                Volgende uitzending komt eraan...
            </div>
        </div>
        
        <footer>
            Online luisteren naar de AI Songs Radio
        </footer>
    </div>

    <script>
        class RadioScheduler {
            constructor() {
                // Schema met tijden en bestanden
                this.schedule = [
                    { time: '04:00', file: '04.00.mp3', title: 'Vroegprogramma' },
                    { time: '06:00', file: '06.00.mp3', title: 'Ochtendnieuws' },
                    { time: '07:00', file: '07.00.mp3', title: 'Ontbijtshow' },
                    { time: '09:00', file: '09.00.mp3', title: 'Ochtendsessie' },
                    { time: '10:00', file: '10.00.mp3', title: 'Voormiddagprogramma' },
                    { time: '12:00', file: '12.00.mp3', title: 'Middageditie' }
                ];
                
                this.audio = new Audio();
                this.audio.volume = 1.0; // Altijd maximaal volume
                this.isRadioActive = false;
                this.isPlaying = false;
                this.preloadTime = 30; // 30 seconden van tevoren laden
                this.nextAudio = null;
                this.currentPlayingIndex = -1;
                this.preloadTimeout = null;
                this.playTimeout = null;
                this.checkInterval = null;
                
                this.initialize();
            }
            
            initialize() {
                this.setupEventListeners();
                this.updateScheduleDisplay();
                this.updateTimeDisplay();
                
                // Update tijd elke seconde
                setInterval(() => this.updateTimeDisplay(), 1000);
            }
            
            setupEventListeners() {
                document.getElementById('startButton').addEventListener('click', () => {
                    this.startRadio();
                });
                
                this.audio.addEventListener('ended', () => {
                    this.isPlaying = false;
                    this.currentPlayingIndex = -1;
                    this.updateStatus();
                    this.updateDisplay();
                    this.checkSchedule(); // Direct controleren wat nu moet spelen
                });
                
                this.audio.addEventListener('error', (e) => {
                    console.error('Audio error:', e);
                    this.isPlaying = false;
                    this.currentPlayingIndex = -1;
                    this.updateStatus('Fout bij afspelen');
                    this.updateDisplay();
                });
            }
            
            getCurrentTimeString() {
                const now = new Date();
                const hours = now.getHours().toString().padStart(2, '0');
                const minutes = now.getMinutes().toString().padStart(2, '0');
                const seconds = now.getSeconds().toString().padStart(2, '0');
                return `${hours}:${minutes}:${seconds}`;
            }
            
            getCurrentTimeHM() {
                const now = new Date();
                const hours = now.getHours().toString().padStart(2, '0');
                const minutes = now.getMinutes().toString().padStart(2, '0');
                return `${hours}:${minutes}`;
            }
            
            timeToSeconds(timeStr) {
                const [hours, minutes] = timeStr.split(':').map(Number);
                return hours * 3600 + minutes * 60;
            }
            
            updateTimeDisplay() {
                document.getElementById('currentTimeDisplay').textContent = 
                    `Huidige tijd: ${this.getCurrentTimeString()}`;
            }
            
            findCurrentTrackIndex() {
                const currentTimeHM = this.getCurrentTimeHM();
                const currentTimeSec = this.timeToSeconds(currentTimeHM);
                
                // Zoek het programma dat nu aan zou moeten zijn (op basis van tijd)
                for (let i = this.schedule.length - 1; i >= 0; i--) {
                    const scheduleTimeSec = this.timeToSeconds(this.schedule[i].time);
                    if (scheduleTimeSec <= currentTimeSec) {
                        return i;
                    }
                }
                
                return -1; // Voor eerste programma van de dag
            }
            
            findNextTrackIndex() {
                const currentTimeHM = this.getCurrentTimeHM();
                const currentTimeSec = this.timeToSeconds(currentTimeHM);
                
                // Zoek eerstvolgende programma dat nog moet komen
                for (let i = 0; i < this.schedule.length; i++) {
                    const scheduleTimeSec = this.timeToSeconds(this.schedule[i].time);
                    if (scheduleTimeSec > currentTimeSec) {
                        return i;
                    }
                }
                
                return -1; // Geen volgend programma meer vandaag
            }
            
            startRadio() {
                if (this.isRadioActive) return;
                
                this.isRadioActive = true;
                document.getElementById('startButton').disabled = true;
                document.getElementById('startButton').textContent = 'RADIO ACTIEF';
                
                this.updateStatus('Radio actief');
                this.updateDisplay();
                
                // Start met checken van schema elke seconde
                this.checkInterval = setInterval(() => this.checkSchedule(), 1000);
                
                // Direct eerste check uitvoeren
                this.checkSchedule();
                
                console.log('Radio gestart');
            }
            
            checkSchedule() {
                if (!this.isRadioActive) return;
                
                const currentTimeHM = this.getCurrentTimeHM();
                const currentTimeSec = this.timeToSeconds(currentTimeHM);
                const currentSeconds = new Date().getSeconds();
                
                // Controleer of het tijd is om te spelen (precies op de minuut)
                for (let i = 0; i < this.schedule.length; i++) {
                    const scheduleItem = this.schedule[i];
                    const scheduleTimeSec = this.timeToSeconds(scheduleItem.time);
                    
                    // EXACT op de minuut spelen (seconden = 0)
                    if (currentTimeSec === scheduleTimeSec && currentSeconds === 0) {
                        if (!this.isPlaying || this.currentPlayingIndex !== i) {
                            this.playSchedule(i);
                        }
                        break;
                    }
                    
                    // Preload 30 seconden van tevoren
                    if (scheduleTimeSec - currentTimeSec === this.preloadTime) {
                        this.preloadSchedule(i);
                    }
                }
                
                this.updateDisplay();
                this.updateScheduleDisplay();
            }
            
            preloadSchedule(index) {
                const scheduleItem = this.schedule[index];
                
                // Toon loading info
                const loadingInfo = document.getElementById('loadingInfo');
                loadingInfo.style.display = 'block';
                loadingInfo.textContent = `Bestand "${scheduleItem.title}" wordt geladen voor ${scheduleItem.time}...`;
                
                // Maak preload audio element
                this.nextAudio = new Audio();
                this.nextAudio.volume = 0; // Geluid uit voor preload
                this.nextAudio.preload = 'auto';
                this.nextAudio.src = scheduleItem.file;
                
                // Zorg dat het bestand echt geladen wordt
                this.nextAudio.load();
                
                console.log(`Preloading ${scheduleItem.file} voor ${scheduleItem.time}`);
                
                // Verberg loading info na 5 seconden
                setTimeout(() => {
                    loadingInfo.style.display = 'none';
                }, 5000);
            }
            
            playSchedule(index) {
                const scheduleItem = this.schedule[index];
                this.currentPlayingIndex = index;
                
                // Stop eventuele huidige playback
                if (this.isPlaying) {
                    this.audio.pause();
                    this.audio.currentTime = 0;
                }
                
                // Gebruik preloaded audio als beschikbaar
                if (this.nextAudio && this.nextAudio.src.includes(scheduleItem.file)) {
                    this.audio = this.nextAudio;
                    this.audio.volume = 1.0; // Volume aanzetten
                    this.nextAudio = null;
                } else {
                    this.audio.src = scheduleItem.file;
                }
                
                // Speel af
                this.audio.play().then(() => {
                    this.isPlaying = true;
                    this.updateStatus(`Nu aan het spelen: ${scheduleItem.title}`);
                    this.updateDisplay();
                    console.log(`Spelen: ${scheduleItem.file} om ${scheduleItem.time}`);
                }).catch(e => {
                    console.error('Play failed:', e);
                    this.updateStatus('Kan niet afspelen - probeer opnieuw');
                });
            }
            
            updateStatus(message = null) {
                const statusDot = document.getElementById('statusDot');
                const statusText = document.getElementById('statusText');
                
                if (this.isPlaying) {
                    statusDot.className = 'status-dot playing';
                    if (!message) message = 'Nu aan het spelen';
                } else if (this.isRadioActive) {
                    statusDot.className = 'status-dot ready';
                    if (!message) message = 'Radio actief - wacht op volgende uitzending';
                } else {
                    statusDot.className = 'status-dot';
                    if (!message) message = 'Klik op START om radio te beginnen';
                }
                
                if (message) {
                    statusText.textContent = message;
                }
            }
            
            updateDisplay() {
                const upcomingInfo = document.getElementById('upcomingInfo');
                
                if (this.isPlaying && this.currentPlayingIndex >= 0) {
                    // Toon wat er NU speelt
                    const currentItem = this.schedule[this.currentPlayingIndex];
                    document.getElementById('currentTrackTitle').textContent = 
                        `▶ ${currentItem.title}`;
                    document.getElementById('currentTrackTime').textContent = 
                        `Nu aan het spelen (gestart om ${currentItem.time})`;
                    
                    upcomingInfo.style.display = 'none';
                    
                } else if (this.isRadioActive) {
                    // Toon eerstvolgende uitzending wanneer we wachten
                    const nextIndex = this.findNextTrackIndex();
                    
                    if (nextIndex >= 0) {
                        const nextItem = this.schedule[nextIndex];
                        const currentTimeSec = this.timeToSeconds(this.getCurrentTimeHM());
                        const nextTimeSec = this.timeToSeconds(nextItem.time);
                        const timeDiff = nextTimeSec - currentTimeSec;
                        const minutes = Math.floor(timeDiff / 60);
                        const seconds = timeDiff % 60;
                        
                        document.getElementById('currentTrackTitle').textContent = 
                            `Volgende: ${nextItem.title}`;
                        document.getElementById('currentTrackTime').textContent = 
                            `Start om ${nextItem.time}`;
                        
                        // Toon extra info over wanneer het begint
                        if (timeDiff > 0) {
                            if (minutes > 0) {
                                upcomingInfo.innerHTML = 
                                    `Start over <strong>${minutes} minuten en ${seconds} seconden</strong>`;
                            } else {
                                upcomingInfo.innerHTML = 
                                    `Start over <strong>${seconds} seconden</strong>`;
                            }
                            upcomingInfo.style.display = 'block';
                        } else {
                            upcomingInfo.style.display = 'none';
                        }
                    } else {
                        // Geen programma's meer vandaag
                        document.getElementById('currentTrackTitle').textContent = 
                            'Geen uitzendingen meer vandaag';
                        document.getElementById('currentTrackTime').textContent = 
                            'Laatste programma is geweest';
                        upcomingInfo.style.display = 'none';
                    }
                } else {
                    // Radio is uit
                    document.getElementById('currentTrackTitle').textContent = 
                        'Radio uitgeschakeld';
                    document.getElementById('currentTrackTime').textContent = 
                        '--:--';
                    upcomingInfo.style.display = 'none';
                }
            }
            
            updateScheduleDisplay() {
                const scheduleList = document.getElementById('scheduleList');
                scheduleList.innerHTML = '';
                
                const currentTimeHM = this.getCurrentTimeHM();
                const currentTimeSec = this.timeToSeconds(currentTimeHM);
                
                this.schedule.forEach((item, index) => {
                    const scheduleTimeSec = this.timeToSeconds(item.time);
                    const li = document.createElement('li');
                    li.className = 'schedule-item';
                    
                    // Voeg classes toe op basis van status
                    if (this.isPlaying && this.currentPlayingIndex === index) {
                        li.classList.add('current-playing');
                    } else {
                        const nextIndex = this.findNextTrackIndex();
                        if (index === nextIndex) {
                            li.classList.add('next-up');
                        }
                    }
                    
                    // Bereken tijd verschil
                    const timeDiff = scheduleTimeSec - currentTimeSec;
                    let status = '';
                    
                    if (timeDiff === this.preloadTime) {
                        li.classList.add('preloading');
                        status = 'Laden over 30 sec';
                    } else if (this.isPlaying && this.currentPlayingIndex === index) {
                        status = '▶ Nu aan het spelen';
                    } else if (timeDiff > 0 && timeDiff <= 60) {
                        status = `Over ${timeDiff} seconden`;
                    } else if (timeDiff <= 0 && timeDiff >= -300) { // Tot 5 minuten geleden
                        status = 'Afgelopen';
                    } else if (timeDiff > 0) {
                        const minutes = Math.floor(timeDiff / 60);
                        status = `Over ${minutes} minuten`;
                    } else {
                        status = 'Geweest';
                    }
                    
                    li.innerHTML = `
                        <div class="schedule-time">${item.time}</div>
                        <div class="schedule-track">${item.title}</div>
                        <div class="schedule-status">${status}</div>
                    `;
                    
                    scheduleList.appendChild(li);
                });
            }
        }
        
        // Initialiseer radio wanneer pagina laadt
        document.addEventListener('DOMContentLoaded', () => {
            window.radio = new RadioScheduler();
        });
    </script>
</body>
</html>
